<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico | Wheaton</title>
<link rel="icon" type="image/png" href="icon-192.png">
<style>body{font-family:Arial,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#1e2a38}h1{font-size:20px}
.l{padding:10px 12px;border-radius:6px;margin:8px 0;font-size:14px}.ok{background:#e9f7ef;color:#1b5e20}.er{background:#ffebee;color:#b71c1c}.av{background:#fff3e0;color:#8a4b00}
small{display:block;margin-top:4px;opacity:.85}</style></head><body>
<h1>Diagnóstico do sistema (Supabase)</h1>
<p>Abra esta página na mesma pasta do <b>config.js</b>. Ela confere a configuração e as tabelas.</p>
<div id="r"></div>
<script src="config.js"></script>
<script>
var R=document.getElementById('r');
function linha(c,t,d){var e=document.createElement('div');e.className='l '+c;e.textContent=t;if(d){var s=document.createElement('small');s.textContent=d;e.appendChild(s);}R.appendChild(e);}
(async function(){
 if(typeof SUPABASE_URL==='undefined'||typeof SUPABASE_ANON_KEY==='undefined'){linha('er','config.js não foi carregado','O arquivo config.js precisa estar no GitHub, na mesma pasta deste arquivo, com este nome exato (minúsculas).');return;}
 if(!/^https:\/\/\S+$/.test(SUPABASE_URL)||/COLOQUE|SEU_PROJETO/i.test(SUPABASE_URL)){linha('er','SUPABASE_URL não preenchida','Cole o "Project URL" (https://xxxx.supabase.co) em config.js.');return;}
 if(!SUPABASE_ANON_KEY||/COLOQUE/i.test(SUPABASE_ANON_KEY)){linha('er','SUPABASE_ANON_KEY não preenchida','Cole a chave publishable/anon em config.js.');return;}
 if(/service_role|secret/i.test(SUPABASE_ANON_KEY)||/^sb_secret_/.test(SUPABASE_ANON_KEY)){linha('er','Chave secreta no config.js!','Troque por a chave publishable/anon. Nunca publique a service_role/secret.');return;}
 linha('ok','config.js carregado', SUPABASE_URL);
 var h={apikey:SUPABASE_ANON_KEY};if(!String(SUPABASE_ANON_KEY).startsWith('sb_'))h.Authorization='Bearer '+SUPABASE_ANON_KEY;
 var base=SUPABASE_URL.replace(/\/$/,'');
 var tabelas=['agendamentos','conferentes','conf_pdfs','conf_romaneios','conf_avulsas'];
 for(var i=0;i<tabelas.length;i++){var t=tabelas[i];
  try{var r=await fetch(base+'/rest/v1/'+t+'?select=*&limit=1',{headers:h});
   if(r.ok){var j=await r.json();linha('ok','Tabela '+t+': OK','registros lidos neste teste: '+j.length);}
   else{var tx=await r.text();
    var dica=r.status===401||r.status===403?'Chave inválida ou sem permissão. Confira a chave e rode o conferencia_supabase.sql (permissões).':
             r.status===404?'Tabela não existe. Rode o conferencia_supabase.sql no SQL Editor.':'Veja a mensagem acima.';
    linha('er','Tabela '+t+': erro '+r.status,dica+' — '+tx.slice(0,160));}
  }catch(e){linha('er','Tabela '+t+': sem conexão','Confira a SUPABASE_URL e a internet. '+e.message);}
 }
 var colunas=[['conf_pdfs','cliente_cod,transportadora,total_pdf,qtd_lida,validacao'],['conf_romaneios','cavalo,carreta,nota_fiscal']];
 for(var k=0;k<colunas.length;k++){var c=colunas[k];
  try{var r2=await fetch(base+'/rest/v1/'+c[0]+'?select='+c[1]+'&limit=1',{headers:h});
   if(r2.ok)linha('ok','Colunas de '+c[0]+': OK',c[1]);
   else linha('er','Colunas de '+c[0]+': faltam colunas','Rode o conferencia_supabase.sql no SQL Editor para criar: '+c[1]);
  }catch(e){linha('er','Colunas de '+c[0]+': sem conexão',e.message);}
 }
})();
</script></body></html>
